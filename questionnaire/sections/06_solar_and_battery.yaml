section_id: SOLAR_BATTERY
section_title: Solar PV, battery and EV
source: Scaled Demand Flexibility Pilots
questions:
  - id: SOLAR_28
    section: Solar PV, battery and EV
    question_text: Which of the following energy technologies are installed at this property? Select all that apply.
    response_type: multi_choice
    options:
      - code: SOLAR_PV
        label: Solar PV
      - code: SOLAR_HOT_WATER_THERMAL
        label: Solar hot water (thermal)
      - code: BATTERY_STORAGE
        label: Battery storage
      - code: EV_CHARGER_SMART
        label: EV charger (controlled/smart)
      - code: CONTROLLED_HOT_WATER_DIVERTER_LINKED_TO_PV
        label: Controlled hot water diverter linked to PV
      - code: OTHER_CONTROLLED_LOAD_LINKED_TO_PV
        label: Other controlled load linked to PV
      - code: NONE_OF_ABOVE
        label: None of the above
    allow_other: true
    required: false
    skip_logic:
      human: If SOLAR_PV is selected, ask SOLAR_29 to SOLAR_31. If BATTERY_STORAGE is selected, ask BATT_32 to BATT_34. Ask SOLAR_35 when any installed technology is selected (excluding NONE_OF_ABOVE).
      rules:
        - if_option_code: SOLAR_PV
          goto_question_id: SOLAR_29
        - if_option_code: BATTERY_STORAGE
          goto_question_id: BATT_32
        - if_option_code: SOLAR_HOT_WATER_THERMAL
          goto_question_id: SOLAR_35
        - if_option_code: EV_CHARGER_SMART
          goto_question_id: SOLAR_35
        - if_option_code: CONTROLLED_HOT_WATER_DIVERTER_LINKED_TO_PV
          goto_question_id: SOLAR_35
        - if_option_code: OTHER_CONTROLLED_LOAD_LINKED_TO_PV
          goto_question_id: SOLAR_35
    notes: Treat NONE_OF_ABOVE as mutually exclusive in collection UI.
    purpose: TODO - define analytic purpose.
    source: Scaled Demand Flexibility Pilots
    provenance_page: 9

