questions:
  - id: OA_24A
    section: Other appliances
    question_text: Do you have a clothes dryer at this property? Please select one option.
    response_type: single_choice
    options:
      - code: YES_VENTED_TUMBLE_ELECTRIC
        label: Yes - vented/tumble dryer (electric)
      - code: YES_CONDENSER_ELECTRIC
        label: Yes - condenser dryer (electric)
      - code: YES_HEAT_PUMP_DRYER
        label: Yes - heat pump dryer
      - code: "NO"
        label: "No"
      - code: UNSURE
        label: Unsure
    allow_other: false
    required: false
    skip_logic:
      human: If any YES option is selected, ask OA_24B. If NO or UNSURE, skip to OA_24C.
      rules:
        - if_option_code: YES_VENTED_TUMBLE_ELECTRIC
          goto_question_id: OA_24B
        - if_option_code: YES_CONDENSER_ELECTRIC
          goto_question_id: OA_24B
        - if_option_code: YES_HEAT_PUMP_DRYER
          goto_question_id: OA_24B
        - if_option_code: "NO"
          goto_question_id: OA_24C
        - if_option_code: UNSURE
          goto_question_id: OA_24C
    notes: Dryer type captures core technology for load-shifting suitability.
    purpose: TODO - define analytic purpose.
    source: Scaled Demand Flexibility Pilots
    provenance_page: 7

