        label: Stand-alone house - two or more storeys
      - code: TERRACED_JOINED
        label: Terraced house / joined unit
      - code: FLAT_CONVERTED
        label: Flat in converted house
      - code: APARTMENT_PURPOSE_BUILT
        label: Apartment / flat in purpose-built block
      - code: APARTMENT_COMMERCIAL_BUILDING
        label: Apartment / flat in commercial building (e.g. building shared with offices or a shop)
