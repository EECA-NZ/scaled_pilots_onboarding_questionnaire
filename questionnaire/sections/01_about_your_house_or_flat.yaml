        label: Other
    allow_other: true
    required: false
    skip_logic:
      human: None specified.
      rules: []
    notes: Source-neutral coding retained for analysis consistency.
    purpose: TODO - define analytic purpose.
    source: Scaled Demand Flexibility Pilots
    provenance_page: 2

