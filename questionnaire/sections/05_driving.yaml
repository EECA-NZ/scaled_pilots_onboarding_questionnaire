    question_text: What is the primary vehicle type at this property? Please select one option.
    response_type: single_choice
    options:
      - code: PETROL
        label: Petrol
      - code: DIESEL
        label: Diesel
      - code: HYBRID
        label: Hybrid
      - code: PLUG_IN_HYBRID
        label: Plug-in hybrid
      - code: ELECTRIC
        label: Electric
      - code: NO_VEHICLE
        label: No vehicle
      - code: UNSURE
        label: Unsure
    allow_other: false
    required: false
    skip_logic:
      human: If PLUG_IN_HYBRID or ELECTRIC, ask VEH_56. If NO_VEHICLE, skip VEH_53 and VEH_54.
      rules:
        - if_option_code: PLUG_IN_HYBRID
          goto_question_id: VEH_56
        - if_option_code: ELECTRIC
          goto_question_id: VEH_56
        - if_option_code: NO_VEHICLE
          goto_question_id: VEH_58
    notes: Set vehicle_type to null when NO_VEHICLE is selected.
    purpose: TODO - define analytic purpose.
    source: Scaled Demand Flexibility Pilots
    provenance_page: 9

