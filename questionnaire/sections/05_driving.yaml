  - id: VEH_51
    section: Driving
    question_text: How many vehicles are usually kept at this property? Please select one option.
    response_type: single_choice
    options:
      - code: ZERO
        label: "0"
      - code: ONE
        label: "1"
      - code: TWO
        label: "2"
      - code: THREE_PLUS
        label: 3 or more
      - code: UNSURE
        label: Unsure
    allow_other: false
    required: false
    skip_logic:
      human: Context only.
      rules: []
    notes: Context-only indicator of vehicle count; not directly mapped to DrivingAnswers fields.
    purpose: TODO - define analytic purpose.
