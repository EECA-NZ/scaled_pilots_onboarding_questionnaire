name: Deploy Review Page

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Build main/dev variants
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/*:refs/remotes/origin/*"

          build_ref() {
            local ref="$1"
            local outdir="$2"
            local wt_dir
            wt_dir="$(mktemp -d)"
            git worktree add --detach "$wt_dir" "$ref"
            (
              cd "$wt_dir"
              python scripts/validate_questionnaire.py
              python scripts/build_questionnaire_outputs.py
              mkdir -p "$GITHUB_WORKSPACE/_site/${outdir}"
              cp questionnaire/review.html "$GITHUB_WORKSPACE/_site/${outdir}/index.html"
              cp questionnaire/codebook.csv "$GITHUB_WORKSPACE/_site/${outdir}/codebook.csv"
            )
            git worktree remove --force "$wt_dir"
          }

          mkdir -p _site

          # Main version is published at the Pages root.
          build_ref "origin/main" "."

          # Dev version comes from pushed branch when not main; otherwise from dev branch.
          DEV_SOURCE="${GITHUB_REF_NAME}"
          if [ "$DEV_SOURCE" = "main" ]; then
            DEV_SOURCE="dev"
          fi

          if git show-ref --verify --quiet "refs/remotes/origin/${DEV_SOURCE}"; then
            DEV_GIT_REF="origin/${DEV_SOURCE}"
            DEV_REF="${DEV_SOURCE}"
          else
            DEV_GIT_REF="origin/main"
            DEV_REF="main"
          fi

          build_ref "$DEV_GIT_REF" "dev"

          DEV_SHA="$(git rev-parse --short "$DEV_GIT_REF")"
          export DEV_REF DEV_SHA
          python - <<'PY'
          from pathlib import Path
          import html
          import os

          path = Path("_site/dev/index.html")
          content = path.read_text(encoding="utf-8")

          banner = (
              "<div style=\""
              "position:sticky;top:0;z-index:9999;"
              "background:#fff3cd;color:#4f3d00;"
              "border-bottom:1px solid #e0c77a;"
              "padding:10px 14px;"
              "font:600 0.92rem Arial, Helvetica, sans-serif;\">"
              "Dev preview: branch "
              f"{html.escape(os.environ['DEV_REF'])}"
              " @ "
              f"{html.escape(os.environ['DEV_SHA'])}"
              "</div>"
          )

          if "<body>" in content:
              content = content.replace("<body>", "<body>\n" + banner, 1)
          else:
              content = banner + "\n" + content

          path.write_text(content, encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
